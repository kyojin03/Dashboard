<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>My Week — Academic Affairs Workload Reporting</title>
  <meta name="description" content="Weekly work reporting for the Academic Affairs team: planned tasks, additional work, accomplishments, and team overview.">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Academic Affairs</h1>
      <div class="sub">Weekly accomplishment reporting</div>
    </div>
    <div class="spacer"></div>
    <div class="actions row">
      <select id="memberSelect" aria-label="Select team member"></select>
      <div class="weekstep" role="group" aria-label="Reporting week">
        <button type="button" class="wk-btn" data-act="week-prev" aria-label="Previous week">&#8249;</button>
        <span id="weekLabel" class="wk-label" aria-live="polite"></span>
        <button type="button" class="wk-btn" data-act="week-next" aria-label="Next week">&#8250;</button>
        <button type="button" class="wk-today" id="weekToday" data-act="week-today" hidden>This week</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" aria-label="Main sections">
      <button data-view="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>My Week</button>
      <button data-view="additional"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>Additional Tasks</button>
      <button data-view="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3.5 20c.8-3.2 2.9-5 5.5-5s4.7 1.8 5.5 5M16 4.8a3.5 3.5 0 0 1 0 6.4M17.5 15.3c1.7.7 2.7 2.2 3 4.7"/></svg>Team Overview</button>
      <button data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3.5h8L19 8.5V20.5H6z"/><path d="M14 3.5V8.5H19M9 13h6M9 16.5h6"/></svg>Weekly Reports</button>
    </nav>
    <main class="main">
      <div id="loading" class="banner" style="display:none">Loading…</div>
      <div id="banner" class="banner"></div>
      <div id="view"></div>
      <footer class="muted no-print" style="margin-top:18px">
        Selecting a name chooses whose work to view; it does not verify identity. Saving needs an edit key; roster changes need an admin key.
        Asia/Manila · week runs Mon–Sun (working days Mon–Fri).
      </footer>
    </main>
  </div>

  <div id="toasts" class="toast" aria-live="polite"></div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/reports.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
